<div class="project-card">
  <div class="container-logo-tag">
    <img class="logo" [src]="project.logoUrl" alt="Logo du projet">
    <div class="tag">{{ project.tag }}</div>
  </div>

  <img class="picture" [src]="project.imageUrl" alt="Aperçu du projet">

  <p>{{ project.description }}</p>

  <div class="project-links">
    <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" rel="noopener noreferrer">
      GitHub

    </a>
    <a *ngIf="project.siteUrl" [href]="project.siteUrl" target="_blank" rel="noopener noreferrer">
      Voir le site
    </a>
  </div>
</div>
